name: Accessibility gate

# Builds the site and runs the axe-core contrast/a11y gate over the homepage
# and design-system page. Fails the run on any contrast or serious/critical
# violation. This does NOT deploy anything; Pages still publishes from the
# committed /homepage folder on the main branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (also downloads Chrome for Puppeteer)
        working-directory: web
        run: npm ci

      - name: Build and run the a11y/contrast gate
        working-directory: web
        run: npm run test:a11y
